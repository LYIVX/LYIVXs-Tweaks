name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to set (overrides mod_version)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version from tag
        id: derive
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            # strip leading v if present
            VER="${TAG#v}"
            echo "version=$VER" >> $GITHUB_OUTPUT
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=" >> $GITHUB_OUTPUT
          fi

      - name: Build (tagged version)
        if: ${{ steps.derive.outputs.version != '' }}
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.9
          arguments: -Pmod_version=${{ steps.derive.outputs.version }} build --stacktrace

      - name: Build (default version)
        if: ${{ steps.derive.outputs.version == '' }}
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.9
          arguments: build --stacktrace

      - name: Publish to GitHub Packages (tagged version)
        if: ${{ steps.derive.outputs.version != '' }}
        uses: gradle/gradle-build-action@v2
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gradle-version: 8.9
          arguments: -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }} -PgprOwner=${{ github.repository_owner }} -PgprRepo=${{ github.event.repository.name }} -Pmod_version=${{ steps.derive.outputs.version }} publish --stacktrace

      - name: Publish to GitHub Packages (default version)
        if: ${{ steps.derive.outputs.version == '' }}
        uses: gradle/gradle-build-action@v2
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gradle-version: 8.9
          arguments: -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }} -PgprOwner=${{ github.repository_owner }} -PgprRepo=${{ github.event.repository.name }} publish --stacktrace


