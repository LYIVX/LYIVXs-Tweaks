name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to set (overrides mod_version)'
        required: false
        default: ''
      mc_version:
        description: 'Minecraft version (e.g., 1.21.4)'
        required: false
        default: ''
      publish_gpr:
        description: 'Also publish to GitHub Packages (true/false)'
        required: false
        default: 'false'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version from tag
        id: derive
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            # strip leading v if present
            VER="${TAG#v}"
            # Parse base version (optionally with pre-release like -rc1 or -1) and optional mc version (accepts -mc or +mc)
            if [[ "$VER" =~ ^([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z\._-]+)?)(?:[\-+]?mc([0-9]+\.[0-9]+(?:\.[0-9]+)?))?$ ]]; then
              echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
              if [[ -n "${BASH_REMATCH[2]}" ]]; then
                echo "mc_version=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
              else
                echo "mc_version=" >> $GITHUB_OUTPUT
              fi
            else
              # Fallback: keep VER as version; try legacy mc extraction
              echo "version=$VER" >> $GITHUB_OUTPUT
              if [[ "$TAG" =~ mc([0-9]+\.[0-9]+(\.[0-9]+)?) ]]; then
                echo "mc_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
              else
                echo "mc_version=" >> $GITHUB_OUTPUT
              fi
            fi
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            # If a full version like 1.0.1-mc1.21.4 is provided, split it; otherwise use as-is
            MANUAL_VER='${{ github.event.inputs.version }}'
            if [[ "$MANUAL_VER" =~ ^([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z\._-]+)?)(?:[\-+]?mc([0-9]+\.[0-9]+(?:\.[0-9]+)?))?$ ]]; then
              echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
              if [[ -n "${BASH_REMATCH[2]}" ]]; then
                echo "mc_version=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
              elif [[ -n "${{ github.event.inputs.mc_version }}" ]]; then
                echo "mc_version=${{ github.event.inputs.mc_version }}" >> $GITHUB_OUTPUT
              else
                echo "mc_version=" >> $GITHUB_OUTPUT
              fi
            else
              echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
              if [[ -n "${{ github.event.inputs.mc_version }}" ]]; then
                echo "mc_version=${{ github.event.inputs.mc_version }}" >> $GITHUB_OUTPUT
              else
                echo "mc_version=" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "mc_version=" >> $GITHUB_OUTPUT
          fi

      - name: Validate Minecraft version is provided
        shell: bash
        run: |
          MC="${{ steps.derive.outputs.mc_version }}"
          if [[ -z "$MC" ]]; then
            echo "::error::Minecraft version is required. Provide it via tag (e.g., v1.0.0-mc1.21.4) or workflow input mc_version."
            exit 1
          fi

      - name: Build (tagged version)
        if: ${{ steps.derive.outputs.version != '' }}
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.9
          arguments: -Pmod_version=${{ steps.derive.outputs.version }} -Pmc_version=${{ steps.derive.outputs.mc_version }} build --stacktrace

      - name: Build (default version)
        if: ${{ steps.derive.outputs.version == '' }}
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.9
          arguments: -Pmc_version=${{ steps.derive.outputs.mc_version }} build --stacktrace

      - name: Publish to GitHub Packages (tagged version)
        if: ${{ steps.derive.outputs.version != '' && github.event.inputs.publish_gpr == 'true' }}
        uses: gradle/gradle-build-action@v2
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gradle-version: 8.9
          arguments: -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }} -PgprOwner=${{ github.repository_owner }} -PgprRepo=${{ github.event.repository.name }} -Pmod_version=${{ steps.derive.outputs.version }} -Pmc_version=${{ steps.derive.outputs.mc_version }} publish --stacktrace

      - name: Publish to GitHub Packages (default version)
        if: ${{ steps.derive.outputs.version == '' && github.event.inputs.publish_gpr == 'true' }}
        uses: gradle/gradle-build-action@v2
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gradle-version: 8.9
          arguments: -Pgpr.user=${{ github.actor }} -Pgpr.key=${{ secrets.GITHUB_TOKEN }} -PgprOwner=${{ github.repository_owner }} -PgprRepo=${{ github.event.repository.name }} -Pmc_version=${{ steps.derive.outputs.mc_version }} publish --stacktrace

      - name: Upload to GitHub Pages Maven (tagged or manual)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.9
          arguments: -Pmc_version=${{ steps.derive.outputs.mc_version }} publishAllPublicationsToPagesRepository --stacktrace

      - name: Verify generated Maven repository contents
        shell: bash
        run: |
          echo "::group::List build/pages-maven"
          ls -R build/pages-maven || true
          echo "::endgroup::"
          ART="lyivxs-tweaks-${{ steps.derive.outputs.mc_version }}-common"
          VER="${{ steps.derive.outputs.version }}"
          if [[ -z "$VER" ]]; then
            # fallback to gradle.properties version when no tag version (manual run)
            VER=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          fi
          POM="build/pages-maven/net/lyivx/$ART/$VER/$ART-$VER.pom"
          if [[ ! -f "$POM" ]]; then
            # If VER accidentally included -mc..., trim it and try again
            if [[ "$VER" == *-mc* ]]; then
              VER_TRIMMED=${VER%%-mc*}
              POM="build/pages-maven/net/lyivx/$ART/$VER_TRIMMED/$ART-$VER_TRIMMED.pom"
            fi
          fi
          if [[ ! -f "$POM" ]]; then
            # Final fallback to gradle.properties mod_version
            VER_FALLBACK=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
            POM="build/pages-maven/net/lyivx/$ART/$VER_FALLBACK/$ART-$VER_FALLBACK.pom"
          fi
          if [[ ! -f "$POM" ]]; then
            echo "::error::Expected POM not found: $POM"
            exit 1
          fi

      - name: Deploy Maven repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/pages-maven
          keep_files: true
          destination_dir: maven


