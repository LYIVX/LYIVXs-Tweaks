plugins {
    id 'dev.architectury.loom' version '1.7-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Normalize artifactId for GitHub Packages and include MC version in the artifact id
        // Desired format: lyivxs-tweaks-<mcVersion>-<module>
        def mc = (project.findProperty('mc_version') ?: rootProject.minecraft_version) as String
        def rawBase = "$rootProject.archives_name".toLowerCase().replace('_','-')
        def module = "$project.name".toLowerCase().replace('_','-')
        def rawName = "$rawBase-$mc-$module"
        archivesName = rawName
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.

        maven {
            url "https://cursemaven.com"
        }

        maven {
            url "https://nexus.resourcefulbees.com/repository/maven-public/"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // GitHub Packages
            if (project.hasProperty('gprRepo') && project.hasProperty('gprOwner')) {
                maven {
                    name = "GitHubPackages"
                    url = uri("https://maven.pkg.github.com/${project.findProperty('gprOwner')}/${project.findProperty('gprRepo')}")
                    credentials {
                        username = System.getenv("GITHUB_ACTOR") ?: (project.findProperty('gpr.user') ?: "")
                        password = System.getenv("GITHUB_TOKEN") ?: (project.findProperty('gpr.key') ?: "")
                    }
                }
            }
            // Local directory for GitHub Pages static Maven repo
            maven {
                name = "Pages"
                // Publish all modules to the root project's build/pages-maven so the workflow can deploy a single dir
                url = uri("${rootProject.buildDir}/pages-maven")
            }
        }
    }
}
